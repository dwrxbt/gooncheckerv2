<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gooner Test</title>
  <style>
    body {
      background: #0d0d0d;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .box {
      background: #1a1a1a;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      width: 300px;
    }
    button {
      margin-top: 15px;
      padding: 12px;
      width: 100%;
      border: none;
      border-radius: 6px;
      background: #ff0055;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    .result {
      margin-top: 20px;
      font-size: 20px;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>How much of a gooner are you?</h2>
  <button onclick="checkGooner()">Check</button>
  <div class="result" id="result"></div>
</div>

<script>
  function checkGooner() {
    const percent = Math.floor(Math.random() * 101);
    document.getElementById("result").innerText =
      `You are ${percent}% gooner`;
  }
</script>

</body>
</html>
