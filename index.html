<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Gooner Scanner</title>

<style>
@font-face {
  font-family: "fontcum";
  src: url("fonts/fontcum.otf") format("opentype");
}

/* BASE UI */
body {
  margin: 0;
  background: #111;
  color: #fff;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  height: 100vh;
  overflow: hidden;
}

.center {
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 28px;
}

button {
  padding: 18px 36px;
  font-size: 22px;
  background: #e6d3a3;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

/* SCANNER */
.scanner {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 28px;
}

.bar {
  width: 48px;
  height: 360px;
  background: #e6d3a3;
  border-radius: 30px;
  overflow: hidden;
  position: relative;
}

.fill {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 0%;
  background: white;
  transition: height 0.18s linear;
}

.fill.erupt {
  animation: erupt 0.8s cubic-bezier(.2,.8,.3,1) forwards;
}

@keyframes erupt {
  0% { height: 100%; }
  40% { height: 135%; }
  100% {
    height: 0%;
    transform: translateY(-140px);
    opacity: 0;
  }
}

.status {
  font-size: 20px;
  opacity: 0.85;
  text-align: center;
  max-width: 300px;
}

/* RESULT MODAL */
.card-modal {
  position: fixed;
  inset: 0;
  display: none;
  background: rgba(0,0,0,0.85);
  align-items: center;
  justify-content: center;
}

.card {
  background: #000;
  padding: 18px;
  border-radius: 18px;
  width: 340px;
  text-align: center;
}

.card img {
  width: 100%;
  border-radius: 12px;
}

/* RESULT TEXT — SPECIAL FONT */
.result-percent {
  margin-top: 14px;
  font-family: "fontcum";
  font-size: 36px;
}

.result-tier {
  font-family: "fontcum";
  font-size: 26px;
  opacity: 0.9;
}

/* BUTTONS */
.card-buttons {
  display: flex;
  gap: 14px;
  margin-top: 18px;
}

.card-buttons button {
  flex: 1;
  font-size: 18px;
}

/* CANVAS */
canvas {
  display: none;
}
</style>
</head>

<body>

<div id="app" class="center">
  <button id="start">Start test</button>

  <div class="scanner" id="scanner">
    <div class="bar">
      <div class="fill" id="fill"></div>
    </div>
    <div class="status" id="status">Initializing scan…</div>
  </div>
</div>

<div class="card-modal" id="cardModal">
  <div class="card">
    <img id="cardImage" />
    <div class="result-percent" id="uiPercent">0% GOONER</div>
    <div class="result-tier" id="uiTier">YOUR TIER</div>
    <div class="card-buttons">
      <button onclick="saveCard()">Save card</button>
      <button onclick="location.reload()">Run again</button>
    </div>
  </div>
</div>

<canvas id="canvas" width="1024" height="1300"></canvas>

<script>
const statuses = [
  "Touching your balls",
  "Massaging the neck",
  "Reading forbidden thoughts",
  "Analyzing browser history",
  "Scanning inner demons",
  "Decrypting private intentions",
  "Synchronizing dopamine",
  "Measuring resistance",
  "Cross-referencing urges",
  "Running goon heuristics"
];

const tiers = [
  [0,0,"Wale.moca"],
  [1,10,"Banditxbt"],
  [11,20,"Oatmilk"],
  [21,30,"Andraz"],
  [31,40,"Hribi"],
  [41,50,"Atns"],
  [51,60,"Taiyo"],
  [61,70,"Ethereal"],
  [71,80,"Cryptopunk"],
  [81,90,"Alyx"],
  [91,99,"Foxy"],
  [100,100,"Telcier"]
];

let finalPercent = 0;
let finalTier = "";

const start = document.getElementById("start");
const scanner = document.getElementById("scanner");
const fill = document.getElementById("fill");
const statusEl = document.getElementById("status");

start.onclick = () => {
  start.style.display = "none";
  scanner.style.display = "flex";

  let progress = 0;
  const shuffled = [...statuses].sort(() => Math.random() - 0.5);
  let i = 0;

  statusEl.innerText = shuffled[i++];

  const statusTimer = setInterval(() => {
    if (i < shuffled.length) statusEl.innerText = shuffled[i++];
  }, 3000);

  const progressTimer = setInterval(() => {
    progress++;
    fill.style.height = progress + "%";

    if (progress >= 100) {
      clearInterval(progressTimer);
      clearInterval(statusTimer);
      fill.classList.add("erupt");
      setTimeout(showResult, 800);
    }
  }, 250);
};

function showResult() {
  finalPercent = Math.floor(Math.random() * 101);
  finalTier = tiers.find(t => finalPercent >= t[0] && finalPercent <= t[1])[2];

  document.getElementById("cardImage").src = `images/${finalTier}.jpg`;
  document.getElementById("uiPercent").innerText = `${finalPercent}% GOONER`;
  document.getElementById("uiTier").innerText = `YOUR TIER: ${finalTier}`;

  document.getElementById("cardModal").style.display = "flex";
}

/* COVER DRAW */
function drawCover(ctx, img, x, y, w, h) {
  const r = Math.max(w / img.width, h / img.height);
  const nw = img.width * r;
  const nh = img.height * r;
  const nx = x + (w - nw) / 2;
  const ny = y + (h - nh) / 2;
  ctx.drawImage(img, nx, ny, nw, nh);
}

function saveCard() {
  document.fonts.ready.then(() => {
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const img = document.getElementById("cardImage");

    const W = canvas.width;
    const H = canvas.height;

    const P = 24;        // внутренний отступ карточки
    const BORDER = 12;   // толщина рамки
    const IMAGE_SIZE = W - P * 2;

    // ===== BACKGROUND =====
    ctx.fillStyle = "#0a0a0a";
    ctx.fillRect(0, 0, W, H);

    // ===== CARD BORDER (ВНУТРИ) =====
    ctx.strokeStyle = "#e6d3a3";
    ctx.lineWidth = BORDER;
    ctx.strokeRect(
      P,
      P,
      W - P * 2,
      H - P * 2
    );

    // ===== IMAGE (COVER, НЕ ВЫЛЕЗАЕТ) =====
    drawCover(
      ctx,
      img,
      P,
      P,
      IMAGE_SIZE,
      IMAGE_SIZE
    );

    // ===== DIVIDER =====
    ctx.fillStyle = "#e6d3a3";
    ctx.fillRect(
      P,
      P + IMAGE_SIZE,
      IMAGE_SIZE,
      6
    );

    // ===== TEXT AREA BG =====
    ctx.fillStyle = "#000";
    ctx.fillRect(
      P,
      P + IMAGE_SIZE + 6,
      IMAGE_SIZE,
      H - (P + IMAGE_SIZE + 6) - P
    );

    // ===== MAIN TEXT =====
    ctx.font = "110px fontcum";
    ctx.fillStyle = "#ffffff";
    ctx.textAlign = "center";
    ctx.fillText(
      `${finalPercent}% GOONER`,
      W / 2,
      P + IMAGE_SIZE + 140
    );

    // ===== TIER TEXT =====
    ctx.font = "48px fontcum";
    ctx.fillText(
      `TIER: ${finalTier}`,
      W / 2,
      P + IMAGE_SIZE + 220
    );

    // ===== SAVE =====
    const link = document.createElement("a");
    link.download = `${finalPercent}-gooner-${finalTier}.jpg`;
    link.href = canvas.toDataURL("image/jpeg", 0.92);
    link.click();
  });
}
</script>

</body>
</html>
