<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gooner Scanner</title>

<style>
body {
  margin: 0;
  background: #111;
  color: #fff;
  font-family: Arial, sans-serif;
  height: 100vh;
  overflow: hidden;
}

.center {
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

button {
  padding: 14px 30px;
  font-size: 18px;
  background: #e6d3a3;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

.scanner {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 24px;
}

/* BAR */
.bar {
  width: 44px;
  height: 340px;
  background: #e6d3a3;
  border-radius: 30px;
  overflow: hidden;
  position: relative;
}

.fill {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 0%;
  background: white;
  transition: height 0.15s linear;
}

/* ERUPTION */
.fill.erupt {
  animation: erupt 0.8s cubic-bezier(.2,.8,.3,1) forwards;
}

@keyframes erupt {
  0%   { height: 100%; }
  40%  { height: 130%; }
  100% {
    height: 0%;
    transform: translateY(-120px);
    opacity: 0;
  }
}

/* STATUS TEXT */
.status {
  font-size: 16px;
  opacity: 0.85;
  min-height: 24px;
  animation: fadeIn 0.4s ease;
  text-align: center;
  max-width: 260px;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 0.85; transform: translateY(0); }
}

/* BLUR */
.blur {
  filter: blur(8px);
}

/* MODAL */
.modal {
  position: fixed;
  inset: 0;
  display: none;
  background: rgba(0,0,0,0.7);
  align-items: center;
  justify-content: center;
}

.modal-content {
  background: #1a1a1a;
  padding: 36px;
  border-radius: 20px;
  width: 340px;
  text-align: center;
}

.percent {
  font-size: 46px;
  margin-bottom: 10px;
}

.tier-label {
  opacity: 0.5;
  margin-bottom: 4px;
}

.tier-name {
  font-size: 26px;
  font-weight: 900;
  letter-spacing: 1px;
  margin-bottom: 24px;
}

.share {
  background: #000;
  color: #fff;
  border: 1px solid #333;
}
</style>
</head>

<body>

<div id="app" class="center">
  <button id="start">Start test</button>

  <div class="scanner" id="scanner">
    <div class="bar">
      <div class="fill" id="fill"></div>
    </div>
    <div class="status" id="status">Initializing scan…</div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <div class="percent" id="percent">0% GOONER</div>
    <div class="tier-label">YOUR TIER</div>
    <div class="tier-name" id="tier">—</div>
    <button class="share">Share on X (image soon)</button>
  </div>
</div>

<script>
/* STATUS MESSAGES */
const baseStatuses = [
  "Touching the spheres",
  "Massaging the neck",
  "Reading forbidden thoughts",
  "Analyzing browser history",
  "Scanning inner demons",
  "Decrypting private intentions",
  "Synchronizing dopamine",
  "Measuring resistance",
  "Cross-referencing urges",
  "Running goon heuristics"
];

/* TIERS */
const tiers = [
  [0,0,"wale.moca"],
  [1,10,"banditxbt"],
  [11,20,"oatmilk"],
  [21,30,"andraz"],
  [31,40,"Heibi"],
  [41,50,"atns"],
  [51,60,"Taiyo"],
  [61,70,"Ethereal"],
  [71,80,"cryptopunk"],
  [81,90,"alyx"],
  [91,99,"foxy"],
  [100,100,"telcier"]
];

const start = document.getElementById("start");
const scanner = document.getElementById("scanner");
const fill = document.getElementById("fill");
const statusEl = document.getElementById("status");
const modal = document.getElementById("modal");
const app = document.getElementById("app");

/* Shuffle helper */
function shuffle(array) {
  return array
    .map(v => ({ v, sort: Math.random() }))
    .sort((a,b) => a.sort - b.sort)
    .map(({ v }) => v);
}

start.onclick = () => {
  start.style.display = "none";
  scanner.style.display = "flex";

  let progress = 0;

  // prepare non-repeating statuses
  const statuses = shuffle([...baseStatuses]);
  let statusIndex = 0;

  statusEl.innerText = statuses[statusIndex++];

  const statusTimer = setInterval(() => {
    if (statusIndex >= statuses.length) return;

    statusEl.innerText = statuses[statusIndex++];
    statusEl.style.animation = "none";
    statusEl.offsetHeight; // force reflow
    statusEl.style.animation = "";
  }, 3000);

  const progressTimer = setInterval(() => {
    progress++;
    fill.style.height = progress + "%";

    if (progress >= 100) {
      clearInterval(progressTimer);
      clearInterval(statusTimer);

      fill.classList.add("erupt");
      setTimeout(showResult, 800);
    }
  }, 250);
};

function showResult() {
  const value = Math.floor(Math.random() * 101);
  const tier = tiers.find(t => value >= t[0] && value <= t[1])[2];

  document.getElementById("percent").innerText = value + "% GOONER";
  document.getElementById("tier").innerText = tier;

  app.classList.add("blur");
  modal.style.display = "flex";
}
</script>

</body>
</html>
