<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Gooner Test</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: #fff;
    height: 100vh;
    overflow: hidden;
  }

  .center {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
  }

  button {
    padding: 14px 30px;
    font-size: 18px;
    background: #e6d3a3;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }

  /* Scanner */
  .scanner {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .bar {
    width: 42px;
    height: 320px;
    background: #e6d3a3;
    border-radius: 24px;
    overflow: hidden;
    position: relative;
  }

  .fill {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 0%;
    background: #fff;
    transition: height 0.2s linear;
  }

  .fill.erupt {
    animation: erupt 0.6s ease-out forwards;
  }

  @keyframes erupt {
    0% {
      transform: scaleY(1);
      opacity: 1;
    }
    50% {
      transform: scaleY(1.4) translateY(-15px);
    }
    100% {
      transform: scaleY(0);
      opacity: 0;
    }
  }

  .status {
    font-size: 15px;
    opacity: 0.8;
    text-align: center;
    max-width: 260px;
  }

  /* Blur */
  .blur {
    filter: blur(8px);
  }

  /* Modal */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    align-items: center;
    justify-content: center;
  }

  .modal-content {
    background: #1a1a1a;
    padding: 32px;
    border-radius: 18px;
    text-align: center;
    width: 320px;
  }

  .percent {
    font-size: 44px;
    margin-bottom: 10px;
  }

  .tier-label {
    opacity: 0.6;
    margin-bottom: 6px;
  }

  .tier-name {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 22px;
  }

  .share {
    background: #000;
    color: #fff;
    border: 1px solid #333;
  }
</style>
</head>

<body>

<div id="app" class="center">
  <button id="startBtn">Start test</button>

  <div class="scanner" id="scanner">
    <div class="bar">
      <div class="fill" id="fill"></div>
    </div>
    <div class="status" id="status">Initializing scan…</div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <div class="percent" id="resultPercent">0% GOONER</div>
    <div class="tier-label">YOUR TIER</div>
    <div class="tier-name" id="resultTier">—</div>
    <button class="share">Share on X (image soon)</button>
  </div>
</div>

<script>
const statuses = [
  "Touching your balls",
  "Massaging the neck",
  "Reading forbidden thoughts",
  "Calibrating instincts",
  "Analyzing browser history",
  "Checking late-night behavior",
  "Scanning inner demons",
  "Cross-referencing urges",
  "Decrypting private intentions",
  "Running deep goon heuristics",
  "Synchronizing dopamine levels",
  "Measuring moral resistance"
];

const tiers = [
  { min: 0, max: 0, name: "wale.moca" },
  { min: 1, max: 10, name: "banditxbt" },
  { min: 11, max: 20, name: "oatmilk" },
  { min: 21, max: 30, name: "andraz" },
  { min: 31, max: 40, name: "Heibi" },
  { min: 41, max: 50, name: "atns" },
  { min: 51, max: 60, name: "Taiyo" },
  { min: 61, max: 70, name: "Ethereal" },
  { min: 71, max: 80, name: "cryptopunk" },
  { min: 81, max: 90, name: "alyx" },
  { min: 91, max: 99, name: "foxy" },
  { min: 100, max: 100, name: "telcier" }
];

const startBtn = document.getElementById("startBtn");
const scanner = document.getElementById("scanner");
const fill = document.getElementById("fill");
const statusEl = document.getElementById("status");
const modal = document.getElementById("modal");
const app = document.getElementById("app");

startBtn.onclick = () => {
  startBtn.style.display = "none";
  scanner.style.display = "flex";

  let progress = 0;

  statusEl.innerText =
    statuses[Math.floor(Math.random() * statuses.length)];

  const statusTimer = setInterval(() => {
    statusEl.innerText =
      statuses[Math.floor(Math.random() * statuses.length)];
  }, 4000);

  const progressTimer = setInterval(() => {
    progress += 1;
    fill.style.height = progress + "%";

    if (progress >= 100) {
      clearInterval(progressTimer);
      clearInterval(statusTimer);

      fill.classList.add("erupt");

      setTimeout(showResult, 600);
    }
  }, 200);
};

function showResult() {
  const percent = Math.floor(Math.random() * 101);
  const tier = tiers.find(t => percent >= t.min && percent <= t.max);

  document.getElementById("resultPercent").innerText =
    percent + "% GOONER";
  document.getElementById("resultTier").innerText =
    tier.name;

  app.classList.add("blur");
  modal.style.display = "flex";
}
</script>

</body>
</html>
