<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gooner Scanner</title>

<style>
@font-face {
  font-family: "fontcum";
  src: url("fonts/fontcum.otf") format("opentype");
}

body {
  margin: 0;
  background: #111;
  color: #fff;
  font-family: Arial, sans-serif;
  height: 100vh;
  overflow: hidden;
}

.center {
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

button {
  padding: 14px 30px;
  font-size: 18px;
  background: #e6d3a3;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

.scanner {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 24px;
}

/* BAR */
.bar {
  width: 44px;
  height: 340px;
  background: #e6d3a3;
  border-radius: 30px;
  overflow: hidden;
  position: relative;
}

.fill {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 0%;
  background: white;
  transition: height 0.15s linear;
}

.fill.erupt {
  animation: erupt 0.8s cubic-bezier(.2,.8,.3,1) forwards;
}

@keyframes erupt {
  0%   { height: 100%; }
  40%  { height: 130%; }
  100% {
    height: 0%;
    transform: translateY(-120px);
    opacity: 0;
  }
}

.status {
  font-size: 16px;
  opacity: 0.85;
  min-height: 24px;
  text-align: center;
  max-width: 260px;
}

/* RESULT CARD */
.card-modal {
  position: fixed;
  inset: 0;
  display: none;
  background: rgba(0,0,0,0.8);
  align-items: center;
  justify-content: center;
}

.card {
  background: #000;
  padding: 16px;
  border-radius: 16px;
  width: 320px;
  text-align: center;
}

.card img {
  width: 100%;
  border-radius: 12px;
}

.card-text {
  margin-top: 12px;
  font-family: "fontcum";
  font-size: 36px;
}

.card-buttons {
  display: flex;
  gap: 12px;
  margin-top: 16px;
}

.card-buttons button {
  flex: 1;
}
</style>
</head>

<body>

<div id="app" class="center">
  <button id="start">Start test</button>

  <div class="scanner" id="scanner">
    <div class="bar">
      <div class="fill" id="fill"></div>
    </div>
    <div class="status" id="status">Initializing scan…</div>
  </div>
</div>

<div class="card-modal" id="cardModal">
  <div class="card">
    <img id="cardImage" />
    <div class="card-text" id="cardText">0% GOONER</div>
    <div class="card-buttons">
      <button onclick="saveCard()">Save card</button>
      <button onclick="location.reload()">Run again</button>
    </div>
  </div>
</div>

<canvas id="canvas" width="1024" height="1024" style="display:none;"></canvas>

<script>
const statusesBase = [
  "Touching the spheres",
  "Massaging the neck",
  "Reading forbidden thoughts",
  "Analyzing browser history",
  "Scanning inner demons",
  "Decrypting private intentions",
  "Synchronizing dopamine",
  "Measuring resistance",
  "Cross-referencing urges",
  "Running goon heuristics"
];

const tiers = [
  [0,0,"wale.moca"],
  [1,10,"banditxbt"],
  [11,20,"oatmilk"],
  [21,30,"andraz"],
  [31,40,"Heibi"],
  [41,50,"atns"],
  [51,60,"Taiyo"],
  [61,70,"Ethereal"],
  [71,80,"cryptopunk"],
  [81,90,"alyx"],
  [91,99,"foxy"],
  [100,100,"telcier"]
];

const start = document.getElementById("start");
const scanner = document.getElementById("scanner");
const fill = document.getElementById("fill");
const statusEl = document.getElementById("status");

start.onclick = () => {
  start.style.display = "none";
  scanner.style.display = "flex";

  let progress = 0;
  const statuses = [...statusesBase].sort(() => Math.random() - 0.5);
  let statusIndex = 0;

  statusEl.innerText = statuses[statusIndex++];

  const statusTimer = setInterval(() => {
    if (statusIndex < statuses.length) {
      statusEl.innerText = statuses[statusIndex++];
    }
  }, 3000);

  const progressTimer = setInterval(() => {
    progress++;
    fill.style.height = progress + "%";

    if (progress >= 100) {
      clearInterval(progressTimer);
      clearInterval(statusTimer);
      fill.classList.add("erupt");
      setTimeout(showResult, 800);
    }
  }, 250);
};

function showResult() {
  const percent = Math.floor(Math.random() * 101);
  const tier = tiers.find(t => percent >= t[0] && percent <= t[1])[2];

  document.getElementById("cardImage").src =
    `images/${tier}.jpg`;
  document.getElementById("cardText").innerText =
    `${percent}% GOONER`;

  document.getElementById("cardModal").style.display = "flex";
}

/* SAVE CARD */
function saveCard() {
  document.fonts.ready.then(() => {
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const img = document.getElementById("cardImage");

    const W = canvas.width;
    const H = canvas.height;

    // background
    ctx.fillStyle = "#0a0a0a";
    ctx.fillRect(0, 0, W, H);

    // card border
    ctx.strokeStyle = "#e6d3a3";
    ctx.lineWidth = 12;
    ctx.strokeRect(6, 6, W - 12, H - 12);

    // image area
    ctx.drawImage(img, 0, 0, W, W);

    // divider
    ctx.fillStyle = "#e6d3a3";
    ctx.fillRect(0, W, W, 6);

    // text area background
    ctx.fillStyle = "#000";
    ctx.fillRect(0, W + 6, W, H - W);

    // main text
    ctx.font = "110px fontcum";
    ctx.fillStyle = "#ffffff";
    ctx.textAlign = "center";
    ctx.fillText(
      document.getElementById("cardText").innerText,
      W / 2,
      W + 140
    );

    // tier subtitle
    ctx.font = "42px Arial";
    ctx.fillStyle = "#bbbbbb";
    ctx.fillText(
      "GOONER TIER",
      W / 2,
      W + 210
    );

    // save
    const link = document.createElement("a");
    link.download = "gooner-card.jpg";
    link.href = canvas.toDataURL("image/jpeg", 0.92);
    link.click();
  });
}
</script>

</body>
</html>
